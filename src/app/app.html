<!-- Mobile Frame Container (Neo-Brutalist Phone Shell) -->
<main class="phone">
  
  <!-- Top Bar Header -->
  <header class="topbar">
    <div class="brand">déci<span>d</span>o</div>
    <div class="dots">
      <div class="dot done"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </header>

  <!-- Main Screen Content -->
  <section class="screen">
    <!-- Navigation Back Link -->
    <div class="back-link">
      <svg lucideArrowLeft class="w-3.5 h-3.5"></svg>
      <span>RETOUR AUX SONDAGES</span>
    </div>

    <h1>Créer un sondage</h1>
    <div class="sub">Sélectionne le type de question pour démarrer.</div>

    <!-- Question Types Grid -->
    <div class="type-grid">
      @for (type of questionTypes; track type.id) {
        <button
          (click)="selectType(type.id)"
          [class.pressed]="selectedType() === type.id"
          class="type-card"
        >
          <div 
            class="type-icon"
            [style.backgroundColor]="type.color"
          >
            @switch (type.id) {
              @case ('qcm') {
                <svg lucideList class="w-4 h-4 text-ink stroke-[2.4]"></svg>
              }
              @case ('duel') {
                <svg lucideSwords class="w-4 h-4 text-ink stroke-[2.4]"></svg>
              }
              @case ('note') {
                <svg lucideStar class="w-4 h-4 text-ink stroke-[2.4]"></svg>
              }
              @case ('libre') {
                <svg lucideMessageSquare class="w-4 h-4 text-ink stroke-[2.4]"></svg>
              }
              @case ('ouverte') {
                <svg lucideAlignLeft class="w-4 h-4 text-ink stroke-[2.4]"></svg>
              }
            }
          </div>
          
          <div>
            <div class="type-name">{{ type.name }}</div>
            <div class="type-desc">{{ type.desc }}</div>
          </div>

          @if (selectedType() === type.id) {
            <div class="absolute top-3 right-3 bg-ink text-white p-0.5 rounded-full">
              <svg lucideCheck class="w-3 h-3 stroke-[3]"></svg>
            </div>
          }
        </button>
      }
    </div>

    <!-- Action Footer Button -->
    <button 
      [disabled]="!selectedType()"
      class="btn btn-primary btn-block"
    >
      <span>Continuer</span>
      <svg lucideChevronRight class="w-4 h-4 stroke-[2.5]"></svg>
    </button>
  </section>

</main>
