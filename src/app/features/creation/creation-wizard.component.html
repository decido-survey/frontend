<app-topbar />

<section class="screen">
  @switch (state.currentStep()) {
    @case ('home') {
      <app-type-step />
    }
    @case ('setup') {
      <app-setup-step />
    }
    @case ('theme') {
      <app-theme-step />
    }
    @case ('advanced') {
      <app-advanced-step />
    }
    @case ('publish') {
      <app-publish-step />
    }
  }
</section>
